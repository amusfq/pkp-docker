name: Build ARM64 image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Enable ARM64 builds
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read build settings
        id: settings
        shell: bash
        run: |
          set -eu
          . ./.env
          {
            echo "PKP_TOOL=$PKP_TOOL"
            echo "PKP_VERSION=$PKP_VERSION"
            echo "WEB_SERVER=$WEB_SERVER"
            echo "BUILD_PKP_APP_OS=$BUILD_PKP_APP_OS"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            PKP_TOOL=${{ steps.settings.outputs.PKP_TOOL }}
            PKP_VERSION=${{ steps.settings.outputs.PKP_VERSION }}
            WEB_SERVER=${{ steps.settings.outputs.WEB_SERVER }}
            BUILD_PKP_APP_OS=${{ steps.settings.outputs.BUILD_PKP_APP_OS }}
            BUILD_LABEL=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:arm64
            ghcr.io/${{ github.repository }}:${{ steps.settings.outputs.PKP_TOOL }}-${{ steps.settings.outputs.PKP_VERSION }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
